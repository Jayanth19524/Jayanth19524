<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jayanth · Skills graph</title>
<style>
:root{--bg:#0a0a0d;--line:#1e1e26;--tx:#f4f4f5;--dim:#8b8b96;--acc:#fcee0a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;left:24px;top:20px;pointer-events:none}
header .k{font:12px 'SF Mono',Menlo,Consolas,monospace;letter-spacing:3px;color:var(--dim)}
header h1{margin:6px 0 0;font-size:26px;letter-spacing:-.5px}
header a{pointer-events:auto;color:var(--acc);font:12px 'SF Mono',Menlo,monospace;text-decoration:none}
#legend{position:fixed;left:24px;bottom:24px;display:flex;flex-direction:column;gap:6px}
#legend button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font:12px 'SF Mono',Menlo,monospace;color:var(--dim);background:rgba(10,10,13,.8);transition:.15s}
#legend button:hover,#legend button.on{color:var(--tx);border-color:currentColor}
#legend i{width:12px;height:12px;display:block}
#panel{position:fixed;right:24px;top:20px;width:290px;padding:18px;border:1px solid var(--line);border-radius:14px;background:rgba(14,14,18,.92);transform:translateY(-8px);opacity:0;pointer-events:none;transition:.2s}
#panel.show{transform:none;opacity:1;pointer-events:auto}
#panel .cat{font:11px 'SF Mono',Menlo,monospace;letter-spacing:2px}
#panel h2{margin:6px 0 10px;font-size:22px}
#panel p{margin:0 0 10px;font-size:13.5px;line-height:1.5;color:var(--dim)}
#panel .chips{display:flex;flex-wrap:wrap;gap:6px}
#panel .chips button{all:unset;cursor:pointer;font:11px 'SF Mono',Menlo,monospace;padding:4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--tx)}
#panel .chips button:hover{border-color:var(--acc);color:var(--acc)}
#hint{position:fixed;right:24px;bottom:24px;font:11px 'SF Mono',Menlo,monospace;color:var(--dim);letter-spacing:1px}
@media(max-width:640px){#panel{left:16px;right:16px;top:auto;bottom:16px;width:auto}#legend{display:none}#hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header><div class="k">SKILLS / HOW THEY CONNECT</div><h1>G V S Jayanth</h1><a href="https://github.com/Jayanth19524">← back to profile</a></header>
<div id="legend"></div>
<div id="panel"><div class="cat" id="pc"></div><h2 id="pn"></h2><p id="pd"></p><div class="chips" id="pk"></div></div>
<div id="hint">hover · drag · click</div>
<script>
const CATS={
  backend:{name:'Backend',color:'#fcee0a',shape:'square'},
  frontend:{name:'Frontend',color:'#ff4d8d',shape:'diamond'},
  data:{name:'Data',color:'#3df5a0',shape:'triangle'},
  infra:{name:'Infra',color:'#35d4ff',shape:'pentagon'},
  ai:{name:'AI & Systems',color:'#a78bfa',shape:'ring'}
};
const L={
 backend:{Java:'ZetaOpt: CAE aviation backend services.','Spring Boot':'ZetaOpt: CAE aviation backend services.','Node.js':'JoyzAI: AI agent workflows and MCP servers.',Python:'facechain-verify and the distributed systems labs.','C++':'TakeMe2Space: satellite firmware interfaces.','C#/.NET':'',Django:'Placements portal for Mahindra University.'},
 frontend:{TypeScript:'ats-npm-1 and binary-tree-visualizer-.',React:'ZetaOpt and JoyzAI frontends.',Angular:''},
 data:{PostgreSQL:'',MySQL:'',MongoDB:''},
 infra:{Docker:'',Kubernetes:'',AWS:'',Azure:'',GCP:'',OCI:'Oracle Cloud Infrastructure Certified Architect.'},
 ai:{'LLM agents':'JoyzAI: production agent workflows.',RAG:'JoyzAI: retrieval-augmented pipelines.',MCP:'JoyzAI: MCP servers and tool orchestration.','Computer vision':'facechain-verify: face verification with InsightFace.','Distributed systems':'Epsilon, and Lamport/vector clock labs.',Telemetry:'TakeMe2Space: ground-station telemetry parsers.'}
};
const CROSS=[['Spring Boot','PostgreSQL'],['Node.js','React'],['Node.js','MCP'],['Python','Computer vision'],['Python','RAG'],['C++','Telemetry'],['Kubernetes','Distributed systems'],['Java','Docker']];

const nodes=[],edges=[],byName={};
function add(n){nodes.push(n);byName[n.name]=n;return n}
const hub=add({name:'Jayanth',kind:'hub',r:34,color:'#fcee0a'});
for(const [k,c] of Object.entries(CATS)){
  const cn=add({name:c.name,key:k,kind:'cat',r:20,color:c.color,shape:c.shape});
  edges.push([hub,cn,210,'spoke']);
  for(const leaf of Object.keys(L[k])){
    const ln=add({name:leaf,key:k,kind:'leaf',r:9,color:c.color,shape:c.shape,info:L[k][leaf]});
    edges.push([cn,ln,150,'branch']);
  }
}
for(const [a,b] of CROSS) edges.push([byName[a],byName[b],340,'cross']);
const adj=new Map(nodes.map(n=>[n,new Set()]));
for(const [a,b] of edges){adj.get(a).add(b);adj.get(b).add(a)}

const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function seed(){
  const S=scale(),ex=1.55,keys=Object.keys(CATS);
  hub.x=W/2;hub.y=H/2+28;
  keys.forEach((k,i)=>{
    const a=(-90+i*72)*Math.PI/180,cn=byName[CATS[k].name];
    cn.x=W/2+Math.cos(a)*190*S*ex;cn.y=H/2+28+Math.sin(a)*175*S;
    const leaves=nodes.filter(n=>n.kind==='leaf'&&n.key===k),m=leaves.length;
    leaves.forEach((l,j)=>{const b=a+(j-(m-1)/2)*(m>4?.26:.4);
      l.x=W/2+Math.cos(b)*380*S*ex;l.y=H/2+28+Math.sin(b)*335*S});
  });
}
nodes.forEach(n=>{n.vx=n.vy=0;n.s=1;n.pin=false});
hub.pin=true;
function scale(){return Math.min(1.3,Math.max(.55,Math.min(W/1000,H/720)))}
seed();

const mouse={x:-999,y:-999,in:false};
let hover=null,drag=null,sel=null,focus=null,moved=0;

function step(){
  const S=scale();
  hub.x+=(W/2-hub.x)*.2;hub.y+=(H/2+28-hub.y)*.2;
  for(let i=0;i<nodes.length;i++){const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
      let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);
      const k=(a.kind==='leaf'&&b.kind==='leaf'?5200:9000)*S*S/d2;
      const fx=dx/d*k,fy=dy/d*k;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy}}
  for(const [a,b,len,t] of edges){
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const k=(t==='cross'?.0012:.02)*(d-len*S)/d;
    const fx=dx*k,fy=dy*k;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy}
  for(const n of nodes){
    n.vx+=(W/2-n.x)*.0007;n.vy+=(H/2+28-n.y)*.0012;           // gentle gravity, wider than tall
    if(mouse.in&&n!==drag&&n!==hover){const dx=n.x-mouse.x,dy=n.y-mouse.y,d=Math.hypot(dx,dy),rr=n.r*scale()+16;
      if(d<110&&d>rr){const f=(110-d)/110*.7;n.vx+=dx/d*f;n.vy+=dy/d*f}}
    if(hover&&n!==hover&&adj.get(hover).has(n)){n.vx+=(hover.x-n.x)*.0016;n.vy+=(hover.y-n.y)*.0016}
    n.vx+=Math.sin(performance.now()/1700+n.x*.01)*.012;n.vy+=Math.cos(performance.now()/1900+n.y*.01)*.012; // idle drift
    n.vx*=.86;n.vy*=.86;
    if(n===drag){n.x=mouse.x;n.y=mouse.y;n.vx=n.vy=0}
    else if(!n.pin){n.x+=n.vx;n.y+=n.vy}
    n.x=Math.max(30,Math.min(W-30,n.x));n.y=Math.max(95,Math.min(H-45,n.y));
    const target=(n===hover||n===sel)?1.45:1;n.s+=(target-n.s)*.18}
}

function shape(n,r){
  cx.beginPath();
  const p=(m,rot)=>{for(let i=0;i<m;i++){const a=rot+i*2*Math.PI/m;cx[i?'lineTo':'moveTo'](n.x+Math.cos(a)*r,n.y+Math.sin(a)*r)}cx.closePath()};
  switch(n.shape){
    case'square':cx.roundRect(n.x-r*.85,n.y-r*.85,r*1.7,r*1.7,r*.25);break;
    case'diamond':p(4,-Math.PI/2);break;
    case'triangle':p(3,-Math.PI/2);break;
    case'pentagon':p(5,-Math.PI/2);break;
    default:cx.arc(n.x,n.y,r,0,7)}
}
function lit(n){
  const ref=hover||sel;
  if(focus&&!(n.key===focus||n===hub))return false;
  if(!ref)return true;
  return n===ref||adj.get(ref).has(n);
}
function draw(){
  cx.clearRect(0,0,W,H);
  const S=scale(),ref=hover||sel;
  for(const [a,b,,t] of edges){
    const on=lit(a)&&lit(b)&&(!ref||a===ref||b===ref||t==='spoke'&&false||(ref&&(a===ref||b===ref)));
    const hot=ref&&(a===ref||b===ref);
    cx.beginPath();cx.moveTo(a.x,a.y);
    if(t==='cross'){const mx=(a.x+b.x)/2+(W/2-(a.x+b.x)/2)*.5,my=(a.y+b.y)/2+(H/2-(a.y+b.y)/2)*.5;cx.quadraticCurveTo(mx,my,b.x,b.y);cx.setLineDash([3,5])}
    else{cx.lineTo(b.x,b.y);cx.setLineDash([])}
    const col=(b.kind==='leaf'||a.kind==='cat')?(b.color||a.color):'#fcee0a';
    cx.strokeStyle=hot?col:(t==='cross'?'rgba(252,238,10,.22)':t==='spoke'?'rgba(252,238,10,.45)':'#1e1e26');
    cx.globalAlpha=(ref&&!hot)?.25:1;cx.lineWidth=hot?2:1.4;cx.stroke();cx.setLineDash([]);cx.globalAlpha=1}
  for(const n of nodes){
    const on=lit(n),r=n.r*S*n.s;
    cx.globalAlpha=on?1:.18;
    if(n.kind==='hub'){
      const t=performance.now()/1000%2.8/2.8;
      cx.beginPath();cx.arc(n.x,n.y,r*(1+t*1.4),0,7);cx.strokeStyle=`rgba(252,238,10,${.5*(1-t)})`;cx.lineWidth=1.5;cx.stroke();
      cx.beginPath();cx.arc(n.x,n.y,r,0,7);cx.fillStyle='#fcee0a';cx.fill();
      cx.fillStyle='#0a0a0d';cx.font='800 14px -apple-system,Segoe UI,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('Jayanth',n.x,n.y+1);
    }else{
      if(n===hover||n===sel){cx.shadowColor=n.color;cx.shadowBlur=22}
      shape(n,r);
      if(n.kind==='cat'||n.shape==='ring'&&n.kind==='cat'){cx.fillStyle=n.color;cx.fill()}
      else if(n.shape==='ring'){cx.fillStyle='#0a0a0d';cx.fill();cx.strokeStyle=n.color;cx.lineWidth=2.4;cx.stroke()}
      else{cx.fillStyle=n.color+'33';cx.fill();cx.strokeStyle=n.color;cx.lineWidth=2;cx.stroke()}
      cx.shadowBlur=0;
      cx.fillStyle=n.kind==='cat'?n.color:'#f4f4f5';
      cx.font=n.kind==='cat'?`700 ${12*Math.max(.9,S)}px 'SF Mono',Menlo,monospace`:`${13*Math.max(.9,S)}px -apple-system,Segoe UI,sans-serif`;
      cx.textBaseline='middle';
      const right=n.x>W/2;
      cx.textAlign=n.kind==='cat'?'center':right?'left':'right';
      const ty=n.kind==='cat'?n.y-r-12:n.y;const tx=n.kind==='cat'?n.x:n.x+(right?1:-1)*(r+8);
      cx.fillText(n.kind==='cat'?n.name.toUpperCase():n.name,tx,ty);
    }
    cx.globalAlpha=1}
}
function loop(){step();draw();requestAnimationFrame(loop)}loop();

function pick(x,y){let best=null,bd=1e9;for(const n of nodes){const d=Math.hypot(n.x-x,n.y-y),r=n.r*scale()*n.s+10;if(d<r&&d<bd){best=n;bd=d}}return best}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointermove',e=>{[mouse.x,mouse.y]=pos(e);mouse.in=true;moved++;if(!drag){hover=pick(mouse.x,mouse.y);cv.style.cursor=hover?'pointer':'default'}});
cv.addEventListener('pointerleave',()=>{mouse.in=false;hover=null});
cv.addEventListener('pointerdown',e=>{[mouse.x,mouse.y]=pos(e);mouse.in=true;moved=0;const n=pick(mouse.x,mouse.y);if(n&&n!==hub){drag=n;cv.setPointerCapture(e.pointerId)}hover=n});
cv.addEventListener('pointerup',e=>{const was=drag;drag=null;if(was&&moved<4)select(was);else if(!was&&moved<4){sel=null;panel(null)}});

const P=document.getElementById('panel');
function chips(list){const el=document.getElementById('pk');el.innerHTML='';list.forEach(n=>{const b=document.createElement('button');b.textContent=n.name;b.onclick=()=>select(n);el.appendChild(b)})}
function select(n){sel=n;panel(n)}
function panel(n){
  if(!n){P.classList.remove('show');return}
  const c=n.key?CATS[n.key]:null;
  document.getElementById('pc').textContent=c?c.name.toUpperCase():'';
  document.getElementById('pc').style.color=c?c.color:'';
  document.getElementById('pn').textContent=n.name;
  document.getElementById('pd').textContent=n.kind==='leaf'?(n.info||'Used across projects and roles.'):n.kind==='cat'?'Click a skill to see where it was used.':'';
  chips([...adj.get(n)].filter(x=>x!==hub));
  P.classList.add('show')}
// legend
const lg=document.getElementById('legend');
for(const [k,c] of Object.entries(CATS)){
  const b=document.createElement('button');b.style.color=c.color;
  b.innerHTML=`<i style="background:${c.color};${({square:'border-radius:3px',diamond:'transform:rotate(45deg) scale(.8)',triangle:'clip-path:polygon(50% 0,100% 100%,0 100%)',pentagon:'clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)',ring:'border-radius:50%;background:none;border:2px solid '+c.color})[c.shape]}"></i><span style="color:#f4f4f5">${c.name}</span>`;
  b.onclick=()=>{focus=focus===k?null:k;[...lg.children].forEach(x=>x.classList.remove('on'));if(focus)b.classList.add('on')};
  lg.appendChild(b)}
</script>
</body>
</html>
