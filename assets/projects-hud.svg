<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .card { fill: #0d1117; stroke: #21262d; stroke-width: 1; }
      .title { font-size: 15px; font-weight: 600; fill: #58a6ff; }
      .desc { font-size: 12.5px; fill: #8b949e; }
      .lang { font-size: 11.5px; fill: #8b949e; }
      .badge { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .badge-txt { font-size: 10.5px; fill: #8b949e; font-weight: 500; }
    </style>
  </defs>

  <!-- Card 1: FaceChain Verify -->
  <g transform="translate(0, 0)">
    <rect width="440" height="120" rx="10" class="card"/>
    <!-- Repo Icon -->
    <path transform="translate(20, 20)" fill="#8b949e" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
    <text x="44" y="33" class="sans title">FaceChain Verify</text>
    <rect x="356" y="18" width="64" height="20" rx="10" class="badge"/>
    <text x="388" y="32" text-anchor="middle" class="sans badge-txt">Featured</text>

    <text x="20" y="58" class="sans desc">Facial verification &amp; reverse image discovery pipeline using</text>
    <text x="20" y="76" class="sans desc">InsightFace, OpenCV, and cryptographic blockchain attestations.</text>

    <circle cx="26" cy="100" r="5" fill="#3572A5"/>
    <text x="36" y="104" class="sans lang">Python · InsightFace · OpenCV · Web3</text>
  </g>

  <!-- Card 2: MCP Agent & RAG Platform -->
  <g transform="translate(460, 0)">
    <rect width="440" height="120" rx="10" class="card"/>
    <path transform="translate(20, 20)" fill="#8b949e" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
    <text x="44" y="33" class="sans title">MCP Agent &amp; RAG Platform</text>
    <rect x="356" y="18" width="64" height="20" rx="10" class="badge"/>
    <text x="388" y="32" text-anchor="middle" class="sans badge-txt">AI Infra</text>

    <text x="20" y="58" class="sans desc">Model Context Protocol (MCP) tool servers, multi-agent</text>
    <text x="20" y="76" class="sans desc">orchestration, and low-latency RAG retrieval workflows.</text>

    <circle cx="26" cy="100" r="5" fill="#3178c6"/>
    <text x="36" y="104" class="sans lang">TypeScript · LangChain · Node.js · RAG</text>
  </g>

  <!-- Card 3: Satellite Ground Station Parser -->
  <g transform="translate(0, 140)">
    <rect width="440" height="120" rx="10" class="card"/>
    <path transform="translate(20, 20)" fill="#8b949e" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
    <text x="44" y="33" class="sans title">Satellite Ground Station Parser</text>
    <rect x="356" y="18" width="64" height="20" rx="10" class="badge"/>
    <text x="388" y="32" text-anchor="middle" class="sans badge-txt">Systems</text>

    <text x="20" y="58" class="sans desc">High-throughput satellite telemetry ingestion, binary frame</text>
    <text x="20" y="76" class="sans desc">decoding, and real-time mission health diagnostics.</text>

    <circle cx="26" cy="100" r="5" fill="#f34b7d"/>
    <text x="36" y="104" class="sans lang">C++ · Java · Embedded Telemetry</text>
  </g>

  <!-- Card 4: ATS Resume Engine -->
  <g transform="translate(460, 140)">
    <rect width="440" height="120" rx="10" class="card"/>
    <path transform="translate(20, 20)" fill="#8b949e" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/>
    <text x="44" y="33" class="sans title">ATS Resume Engine &amp; Placements Portal</text>
    <rect x="356" y="18" width="64" height="20" rx="10" class="badge"/>
    <text x="388" y="32" text-anchor="middle" class="sans badge-txt">Full-Stack</text>

    <text x="20" y="58" class="sans desc">NLP document parsing, semantic candidate matching, automated</text>
    <text x="20" y="76" class="sans desc">ranking pipelines, and full-stack placement management.</text>

    <circle cx="26" cy="100" r="5" fill="#b07219"/>
    <text x="36" y="104" class="sans lang">Java · Spring Boot · Python · Django</text>
  </g>
</svg>
