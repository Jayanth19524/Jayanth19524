<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" width="100%" height="185">
  <defs>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#00ff41" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="1"/>
    </linearGradient>
    <filter id="snakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="contribCells" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="12" height="12" rx="2.5" fill="#0d1824" stroke="#152638" stroke-width="0.8"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .header { font-size: 13px; fill: #00ff41; font-weight: 700; letter-spacing: 1.5px; }
      .c1 { fill: #0e4429; rx: 2.5px; }
      .c2 { fill: #006d32; rx: 2.5px; }
      .c3 { fill: #26a641; rx: 2.5px; }
      .c4 { fill: #00ff41; rx: 2.5px; }
      .pulse-cell { animation: cellBlink 2.4s ease-in-out infinite; }
      @keyframes cellBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <rect width="900" height="185" rx="10" fill="#05080d" stroke="#162436" stroke-width="1.5"/>
  <text x="24" y="28" class="mono header">❯ snake --eat-contributions --mode=CYBER_GRID</text>
  <text x="876" y="28" text-anchor="end" class="mono" font-size="11" fill="#00f0ff">DAEMON: ACTIVE</text>
  <line x1="20" y1="40" x2="880" y2="40" stroke="#1a2c42" stroke-width="1"/>

  <!-- Contribution Matrix Grid (52 cols x 7 rows -> 832x112) -->
  <g transform="translate(34, 54)">
    <rect width="832" height="112" fill="url(#contribCells)"/>

    <!-- Highlighted Contribution Clusters -->
    <rect x="50" y="18" width="12" height="12" class="c2"/>
    <rect x="66" y="34" width="12" height="12" class="c3"/>
    <rect x="82" y="34" width="12" height="12" class="c4 pulse-cell"/>
    <rect x="130" y="50" width="12" height="12" class="c2"/>
    <rect x="146" y="18" width="12" height="12" class="c3"/>
    <rect x="194" y="66" width="12" height="12" class="c4"/>
    <rect x="210" y="50" width="12" height="12" class="c3"/>
    <rect x="258" y="18" width="12" height="12" class="c2"/>
    <rect x="274" y="34" width="12" height="12" class="c4 pulse-cell"/>
    <rect x="322" y="82" width="12" height="12" class="c3"/>
    <rect x="354" y="50" width="12" height="12" class="c4"/>
    <rect x="370" y="34" width="12" height="12" class="c2"/>
    <rect x="418" y="18" width="12" height="12" class="c4 pulse-cell"/>
    <rect x="434" y="34" width="12" height="12" class="c3"/>
    <rect x="482" y="66" width="12" height="12" class="c2"/>
    <rect x="514" y="50" width="12" height="12" class="c4"/>
    <rect x="546" y="18" width="12" height="12" class="c3"/>
    <rect x="578" y="34" width="12" height="12" class="c4 pulse-cell"/>
    <rect x="626" y="82" width="12" height="12" class="c3"/>
    <rect x="658" y="50" width="12" height="12" class="c4"/>
    <rect x="690" y="18" width="12" height="12" class="c2"/>
    <rect x="722" y="34" width="12" height="12" class="c4 pulse-cell"/>
    <rect x="754" y="66" width="12" height="12" class="c3"/>
    <rect x="786" y="50" width="12" height="12" class="c4"/>

    <!-- Animated Cyber Snake Traversing the Grid -->
    <path id="snakeTrack" d="M 8 24 L 200 24 L 200 72 L 424 72 L 424 40 L 648 40 L 648 88 L 816 88 L 816 24 L 8 24"
          fill="none" stroke="#00ff41" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="180 1850" filter="url(#snakeGlow)">
      <animate attributeName="stroke-dashoffset" from="2030" to="0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
