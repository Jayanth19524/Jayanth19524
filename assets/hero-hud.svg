<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <radialGradient id="ambientGlow" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
      .name { font-size: 36px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.8px; }
      .role { font-size: 16px; font-weight: 500; fill: #c9d1d9; }
      .bio { font-size: 13.5px; fill: #8b949e; }
      .badge-bg { fill: #122117; stroke: #2ea043; stroke-opacity: 0.5; stroke-width: 1; }
      .badge-text { font-size: 12px; font-weight: 500; fill: #3fb950; }
      .meta { font-size: 12.5px; fill: #8b949e; }
      .meta-hi { fill: #e6edf3; font-weight: 500; }
      .term-key { font-size: 12px; fill: #79c0ff; }
      .term-val { font-size: 12px; fill: #e6edf3; }
      .term-muted { font-size: 12px; fill: #8b949e; }
      .ripple { animation: rippleAnim 2.4s ease-out infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .line-1 { opacity: 0; animation: appear 0.4s ease forwards 0.2s; }
      .line-2 { opacity: 0; animation: appear 0.4s ease forwards 0.6s; }
      .line-3 { opacity: 0; animation: appear 0.4s ease forwards 1.0s; }
      .line-4 { opacity: 0; animation: appear 0.4s ease forwards 1.4s; }
      .line-5 { opacity: 0; animation: appear 0.4s ease forwards 1.8s; }
      @keyframes rippleAnim {
        0% { r: 4px; opacity: 0.9; }
        100% { r: 12px; opacity: 0; }
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes appear { to { opacity: 1; } }
    </style>
  </defs>

  <!-- Main Card Surface -->
  <rect width="900" height="280" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect width="900" height="280" rx="12" fill="url(#ambientGlow)"/>

  <!-- Left Column: Identity & Intro -->
  <g transform="translate(36, 42)">
    <!-- Live Role Pill -->
    <rect x="0" y="0" width="320" height="28" rx="14" class="badge-bg"/>
    <circle class="ripple" cx="16" cy="14" r="4" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="4" fill="#3fb950"/>
    <text x="28" y="18.5" class="sans badge-text">Software Engineer II @ Epsilon · Bengaluru</text>

    <!-- Name -->
    <text x="0" y="76" class="sans name">G V S Jayanth</text>

    <!-- Bio -->
    <text x="0" y="106" class="sans role">Full-Stack, Distributed Systems &amp; AI Infrastructure</text>
    <text x="0" y="134" class="sans bio">Turning complex problems into clean, reliable production software.</text>
    <text x="0" y="154" class="sans bio">3+ years across enterprise infrastructure, AI agents, and space-tech.</text>

    <!-- Subtle Footer Metadata -->
    <g transform="translate(0, 194)" class="sans meta">
      <text x="0" y="0">
        <tspan class="meta-hi">Bengaluru / Hyderabad, IN</tspan>
        <tspan dx="10">·</tspan>
        <tspan dx="10" class="meta-hi">OCI Certified Architect</tspan>
      </text>
    </g>
  </g>

  <!-- Right Column: Clean macOS Terminal Window -->
  <g transform="translate(465, 30)">
    <rect width="400" height="220" rx="10" fill="#161b22" stroke="url(#termBorder)" stroke-width="1"/>
    <path d="M 1 10 Q 1 1 10 1 L 390 1 Q 399 1 399 10 L 399 32 L 1 32 Z" fill="#0d1117"/>
    <line x1="1" y1="32" x2="399" y2="32" stroke="#21262d" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="18" cy="16.5" r="5" fill="#f85149" opacity="0.85"/>
    <circle cx="34" cy="16.5" r="5" fill="#d29922" opacity="0.85"/>
    <circle cx="50" cy="16.5" r="5" fill="#3fb950" opacity="0.85"/>
    <text x="200" y="20.5" text-anchor="middle" class="mono term-muted" font-size="11">jayanth — zsh</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 56)" class="mono">
      <text x="0" y="0" class="term-muted">$ cat profile.yaml</text>

      <g class="line-1" transform="translate(0, 26)">
        <text x="0" y="0"><tspan class="term-key">current:</tspan> <tspan class="term-val">SWE II @ Epsilon</tspan></text>
      </g>

      <g class="line-2" transform="translate(0, 50)">
        <text x="0" y="0"><tspan class="term-key">prev:</tspan>    <tspan class="term-val">JoyzAI, TakeMe2Space, ZetaOpt</tspan></text>
      </g>

      <g class="line-3" transform="translate(0, 74)">
        <text x="0" y="0"><tspan class="term-key">backend:</tspan> <tspan class="term-val">Java, Spring Boot, Node, Python</tspan></text>
      </g>

      <g class="line-4" transform="translate(0, 98)">
        <text x="0" y="0"><tspan class="term-key">web_ai:</tspan>  <tspan class="term-val">React, TS, LangChain, RAG, MCP</tspan></text>
      </g>

      <g class="line-5" transform="translate(0, 122)">
        <text x="0" y="0"><tspan class="term-key">cloud:</tspan>   <tspan class="term-val">AWS, Azure, Docker, K8s, OCI</tspan></text>
      </g>

      <text x="0" y="150" class="term-muted">$ <tspan class="cursor" fill="#3fb950">▋</tspan></text>
    </g>
  </g>
</svg>
