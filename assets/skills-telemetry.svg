<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320">
  <defs>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b84c"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088cc"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="barWarn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .header { font-size: 13px; fill: #00ff41; font-weight: 700; letter-spacing: 1.5px; }
      .subhead { font-size: 11px; fill: #00f0ff; font-weight: 700; letter-spacing: 1.2px; }
      .label { font-size: 12px; fill: #c9d1d9; }
      .pct { font-size: 11.5px; fill: #00ff41; font-weight: 700; }
      .pct-cyan { font-size: 11.5px; fill: #00f0ff; font-weight: 700; }
      .track { fill: #0d1824; rx: 4px; }
      .bar { rx: 4px; animation: shimmer 3.5s ease-in-out infinite; }
      .warn-pulse { animation: warnBlink 1.2s ease-in-out infinite; }
      @keyframes shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.78; } }
      @keyframes warnBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <rect width="900" height="320" rx="10" fill="#05080d" stroke="#162436" stroke-width="1.5"/>

  <text x="24" y="28" class="mono header">❯ diagnostics --skills --verbose</text>
  <text x="876" y="28" text-anchor="end" class="mono" font-size="11" fill="#00ff41">ALL_MODULES: LOADED</text>
  <line x1="20" y1="40" x2="880" y2="40" stroke="#1a2c42" stroke-width="1"/>

  <!-- Left Column: Core Full-Stack & Cloud -->
  <g transform="translate(24, 64)" class="mono">
    <text x="0" y="0" class="subhead">// FULL-STACK, BACKEND &amp; CLOUD INFRA</text>

    <!-- Row 1 -->
    <text x="0" y="26" class="label">Java / Spring Boot</text>
    <text x="410" y="26" text-anchor="end" class="pct">95%</text>
    <rect x="0" y="33" width="410" height="8" class="track"/>
    <rect x="0" y="33" width="390" height="8" fill="url(#barGreen)" class="bar"/>

    <!-- Row 2 -->
    <text x="0" y="64" class="label">JavaScript / TypeScript / Node.js</text>
    <text x="410" y="64" text-anchor="end" class="pct">92%</text>
    <rect x="0" y="71" width="410" height="8" class="track"/>
    <rect x="0" y="71" width="377" height="8" fill="url(#barGreen)" class="bar"/>

    <!-- Row 3 -->
    <text x="0" y="102" class="label">React / Angular</text>
    <text x="410" y="102" text-anchor="end" class="pct">90%</text>
    <rect x="0" y="109" width="410" height="8" class="track"/>
    <rect x="0" y="109" width="369" height="8" fill="url(#barGreen)" class="bar"/>

    <!-- Row 4 -->
    <text x="0" y="140" class="label">Python / C++ / C# (.NET MVC)</text>
    <text x="410" y="140" text-anchor="end" class="pct">85%</text>
    <rect x="0" y="147" width="410" height="8" class="track"/>
    <rect x="0" y="147" width="348" height="8" fill="url(#barGreen)" class="bar"/>

    <!-- Row 5 -->
    <text x="0" y="178" class="label">Docker / Kubernetes / CI-CD</text>
    <text x="410" y="178" text-anchor="end" class="pct">82%</text>
    <rect x="0" y="185" width="410" height="8" class="track"/>
    <rect x="0" y="185" width="336" height="8" fill="url(#barGreen)" class="bar"/>

    <!-- Row 6 -->
    <text x="0" y="216" class="label">AWS / Azure / Oracle Cloud (OCI Cert)</text>
    <text x="410" y="216" text-anchor="end" class="pct">80%</text>
    <rect x="0" y="223" width="410" height="8" class="track"/>
    <rect x="0" y="223" width="328" height="8" fill="url(#barGreen)" class="bar"/>
  </g>

  <!-- Center Divider -->
  <line x1="450" y1="54" x2="450" y2="300" stroke="#162436" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right Column: AI, Computer Vision & Space-Tech -->
  <g transform="translate(466, 64)" class="mono">
    <text x="0" y="0" class="subhead">// AI AGENTS, VISION &amp; MISSION TELEMETRY</text>

    <!-- Row 1 -->
    <text x="0" y="26" class="label">LangChain / LLMs / GenAI Agents</text>
    <text x="410" y="26" text-anchor="end" class="pct-cyan">88%</text>
    <rect x="0" y="33" width="410" height="8" class="track"/>
    <rect x="0" y="33" width="361" height="8" fill="url(#barCyan)" class="bar"/>

    <!-- Row 2 -->
    <text x="0" y="64" class="label">MCP Servers &amp; Tool Orchestration</text>
    <text x="410" y="64" text-anchor="end" class="pct-cyan">85%</text>
    <rect x="0" y="71" width="410" height="8" class="track"/>
    <rect x="0" y="71" width="348" height="8" fill="url(#barCyan)" class="bar"/>

    <!-- Row 3 -->
    <text x="0" y="102" class="label">Computer Vision / OpenCV / InsightFace</text>
    <text x="410" y="102" text-anchor="end" class="pct-cyan">82%</text>
    <rect x="0" y="109" width="410" height="8" class="track"/>
    <rect x="0" y="109" width="336" height="8" fill="url(#barCyan)" class="bar"/>

    <!-- Row 4 -->
    <text x="0" y="140" class="label">Satellite Firmware &amp; Ground Telemetry</text>
    <text x="410" y="140" text-anchor="end" class="pct-cyan">80%</text>
    <rect x="0" y="147" width="410" height="8" class="track"/>
    <rect x="0" y="147" width="328" height="8" fill="url(#barCyan)" class="bar"/>

    <!-- Row 5 -->
    <text x="0" y="178" class="label">SQL / Postgres / MongoDB / Distributed</text>
    <text x="410" y="178" text-anchor="end" class="pct-cyan">88%</text>
    <rect x="0" y="185" width="410" height="8" class="track"/>
    <rect x="0" y="185" width="361" height="8" fill="url(#barCyan)" class="bar"/>

    <!-- Row 6 -->
    <text x="0" y="216" class="label">sleep_daemon.service</text>
    <text x="410" y="216" text-anchor="end" class="pct warn-pulse" style="fill:#ffb800">10% [LOW]</text>
    <rect x="0" y="223" width="410" height="8" class="track"/>
    <rect x="0" y="223" width="41" height="8" fill="url(#barWarn)" class="warn-pulse" rx="4"/>
  </g>
</svg>
