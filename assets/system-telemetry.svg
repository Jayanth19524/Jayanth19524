<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .header { font-size: 13px; fill: #00ff41; font-weight: 700; letter-spacing: 1.5px; }
      .panel { fill: #08111b; stroke: #1a2c42; stroke-width: 1; rx: 8px; }
      .stat-num { font-size: 22px; fill: #00ff41; font-weight: 800; }
      .stat-lbl { font-size: 10px; fill: #8b949e; letter-spacing: 1px; }
      .key { font-size: 11.5px; fill: #8b949e; }
      .val-on { font-size: 11.5px; fill: #00ff41; font-weight: 700; }
      .val-cyan { font-size: 11.5px; fill: #00f0ff; font-weight: 700; }
      .val-warn { font-size: 11.5px; fill: #ffb800; font-weight: 700; animation: blinkWarn 1.3s ease-in-out infinite; }
      .wave-line { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawWave 4s linear infinite; }
      @keyframes blinkWarn { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes drawWave { 0% { stroke-dashoffset: 600; } 100% { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="900" height="230" rx="10" fill="#05080d" stroke="#162436" stroke-width="1.5"/>
  <text x="24" y="28" class="mono header">❯ systemctl status --all &amp;&amp; telemetry --live-stream</text>
  <text x="876" y="28" text-anchor="end" class="mono" font-size="11" fill="#00ff41">STREAM: 60Hz // NOMINAL</text>
  <line x1="20" y1="40" x2="880" y2="40" stroke="#1a2c42" stroke-width="1"/>

  <!-- Left Panel: System Daemons Status -->
  <g transform="translate(20, 54)" class="mono">
    <rect width="415" height="158" class="panel"/>
    <text x="18" y="24" font-size="11" fill="#00f0ff" font-weight="700">// SUBSYSTEM_DAEMONS (YAML_STATE)</text>

    <text x="18" y="48" class="key">AI_AGENTS_CLUSTER:</text>
    <text x="395" y="48" text-anchor="end" class="val-on">● ONLINE</text>

    <text x="18" y="68" class="key">COMPUTER_VISION_CORE:</text>
    <text x="395" y="68" text-anchor="end" class="val-on">● ONLINE</text>

    <text x="18" y="88" class="key">SATELLITE_TELEMETRY_MOD:</text>
    <text x="395" y="88" text-anchor="end" class="val-cyan">● SYNCED</text>

    <text x="18" y="108" class="key">BLOCKCHAIN_ATTESTATION:</text>
    <text x="395" y="108" text-anchor="end" class="val-cyan">● VERIFIED</text>

    <text x="18" y="128" class="key">CAFFEINE_RESERVE_LEVEL:</text>
    <text x="395" y="128" text-anchor="end" class="val-warn">▲ CRITICAL</text>

    <text x="18" y="148" class="key">SHIPPING_PRODUCTION_CODE:</text>
    <text x="395" y="148" text-anchor="end" class="val-on">✔ TRUE</text>
  </g>

  <!-- Right Panel: Live Activity Waveform & Repo Telemetry -->
  <g transform="translate(455, 54)" class="mono">
    <rect width="425" height="158" class="panel"/>
    <text x="18" y="24" font-size="11" fill="#00f0ff" font-weight="700">// GITHUB_TELEMETRY &amp; SIGNAL_WAVE</text>

    <!-- 3 Key Metrics -->
    <g transform="translate(18, 36)">
      <text x="0" y="20" class="stat-num">60+</text>
      <text x="0" y="34" class="stat-lbl">REPOSITORIES</text>

      <text x="140" y="20" class="stat-num" style="fill:#00f0ff">2+ YRS</text>
      <text x="140" y="34" class="stat-lbl">PROD_SYSTEMS</text>

      <text x="285" y="20" class="stat-num">OCI</text>
      <text x="285" y="34" class="stat-lbl">CERT_ARCHITECT</text>
    </g>

    <!-- Animated Waveform -->
    <g transform="translate(18, 82)">
      <rect width="389" height="60" rx="4" fill="#050a10" stroke="#132234" stroke-width="1"/>
      <path d="M 0 45 L 30 42 L 55 28 L 80 38 L 110 16 L 140 35 L 170 22 L 195 40 L 225 12 L 255 34 L 285 20 L 315 38 L 345 14 L 370 28 L 389 18 L 389 60 L 0 60 Z"
            fill="url(#waveFill)"/>
      <path class="wave-line"
            d="M 0 45 L 30 42 L 55 28 L 80 38 L 110 16 L 140 35 L 170 22 L 195 40 L 225 12 L 255 34 L 285 20 L 315 38 L 345 14 L 370 28 L 389 18"
            fill="none" stroke="#00ff41" stroke-width="2" filter="url(#waveGlow)"/>
    </g>
  </g>
</svg>
