<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="100%" height="20">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00ff41" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="900" y2="10" stroke="url(#divGrad)" stroke-width="1.2"/>
  <rect x="0" y="8.5" width="60" height="3" rx="1.5" fill="#00ff41">
    <animate attributeName="x" from="-60" to="900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
